name: CI

on:
  push:
    branches: [ main, agent-* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          pytest tests/ -q --tb=short
        continue-on-error: true

  contract-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check contract freeze
        run: |
          if git diff --name-only origin/main | grep -q '^docs/contracts/'; then
            echo "::error::Contract files modified without version bump. Contact integrator."
            exit 1
          fi
        continue-on-error: true
